services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prisma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma123
      POSTGRES_DB: prisma
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prisma-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
